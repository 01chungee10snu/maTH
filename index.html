<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>수학꾸러기</title>
  <!-- Google Fonts - 어린이용 귀여운 한글 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css?v=13">
</head>

<body>
  <div id="err" role="alert" aria-live="assertive" aria-hidden="true"></div>

  <!-- 로그인 모달 -->
  <div id="login-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 class="text-2xl font-bold mb-4 text-pink-600 font-jua">수학꾸러기 로그인</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-2 font-jua">이메일</label>
          <input type="email" id="email"
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400"
            placeholder="이메일을 입력해요">
        </div>
        <div>
          <label class="block text-gray-700 mb-2 font-jua">비밀번호</label>
          <input type="password" id="password"
            class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-400"
            placeholder="비밀번호를 입력해요">
        </div>
        <div class="flex gap-2 mt-6">
          <button id="btn-login"
            class="flex-1 bg-pink-500 text-white py-2 rounded-lg hover:bg-pink-600 font-jua transition-colors">로그인</button>
          <button id="btn-signup"
            class="flex-1 bg-purple-500 text-white py-2 rounded-lg hover:bg-purple-600 font-jua transition-colors">회원가입</button>
        </div>
        <button id="btn-guest" class="w-full mt-2 text-gray-500 underline font-jua text-sm">그냥 하기 (게스트)</button>
      </div>
    </div>
  </div>

  <!-- 사용자 배지 -->
  <div id="user-badge" class="user-badge" style="display: none;">
    <span id="user-email"></span>
    <button id="btn-logout"
      class="ml-2 text-xs bg-gray-600 text-white px-2 py-1 rounded hover:bg-gray-700">로그아웃</button>
  </div>

  <div class="wrap">
    <canvas id="app" width="720" height="1280"></canvas>
  </div>

  <!-- 스크립트 로드 순서 중요 -->
  <script src="js/supabasePublicConfig.js?v=14"></script>
  <script src="js/learnerProfiles.js?v=1"></script>
  <script src="js/config.js?v=16"></script>
  <script src="js/canvasText.js?v=1"></script>
  <script src="js/supabase.js?v=14"></script>
  <script src="js/irtEngine.js?v=18"></script>
  <script src="js/irtLearningPolicy.js?v=27"></script>
  <script src="js/irtLog.js?v=18"></script>
  <script src="js/irtSync.js?v=17"></script>
  <script src="js/relationCurriculum.js?v=19"></script>
  <script src="js/adaptiveLearningFlow.js?v=22"></script>
  <script src="js/measurementQuality.js?v=21"></script>
  <script src="js/mathAbilityReport.js?v=22"></script>
  <script src="js/data.js?v=14"></script>
  <script src="js/curriculum.js?v=13"></script>

  <!-- 문제 모듈 로드 (game.js보다 먼저 로드) -->
  <script src="js/problems/problemBase.js?v=14"></script>
  <script src="js/problems/additionProblems.js?v=13"></script>
  <script src="js/problems/subtractionProblems.js?v=14"></script>
  <script src="js/problems/multiplicationProblems.js?v=13"></script>
  <script src="js/problems/divisionProblems.js?v=13"></script>
  <script src="js/problems/numberProblems.js?v=13"></script>
  <script src="js/problems/patternProblems.js?v=13"></script>
  <script src="js/problems/graphProblems.js?v=13"></script>
  <script src="js/problems/geometryProblems.js?v=13"></script>
  <script src="js/problems/measurementProblems.js?v=13"></script>
  <script src="js/problems/lengthProblems.js?v=13"></script>
  <script src="js/problems/fractionProblems.js?v=14"></script>
  <script src="js/problems/creativeProblems.js?v=14"></script>
  <script src="js/problems/capacityWeightVolumeProblems.js?v=15"></script>
  <script src="js/problems/symbolEquationProblems.js?v=14"></script>
  <script src="js/problems/relationshipCoachProblems.js?v=16"></script>
  <script src="js/expandedWordProblemBank.js?v=30"></script>
  <script src="js/problems/index.js?v=13"></script>
  <script src="js/relationCoach.js?v=15"></script>

  <script src="js/game.js?v=22"></script>
</body>

</html>
